<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMI CoE Kavach</title>
  <style>
    /* Remove default margins and ensure full height */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    /* Make the iframe fill most of the page */
    iframe {
      width: 100%;
      height: calc(100% - 50px);
      border: none;
      display: block;
    }
    /* Style for the update button */
    .button-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background-color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .update-button {
      padding: 10px 20px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .update-button:hover {
      background-color: #3367d6;
    }
    .update-button:active {
      background-color: #2a56c6;
    }
  </style>
</head>
<body>
  <iframe 
    id="presentationFrame"
    src="https://docs.google.com/presentation/d/e/2PACX-1vTFD0udq5cOvr1eAkXphCxk9avOWfDSOpWEEN_qpUWVf8OjCJ_bhvlG62uipH_caFGqv1jDeZvPcfW5/embed?start=true&loop=true&delayms=1000&rm=minimal" 
    allowfullscreen="true" 
    mozallowfullscreen="true" 
    webkitallowfullscreen="true">
  </iframe>
  
  <div class="button-container">
    <button id="updateButton" class="update-button">Update</button>
  </div>
  
  <script>
    // Get reference to the button and iframe
    const updateButton = document.getElementById("updateButton");
    const iframe = document.getElementById("presentationFrame");
    
    // Add click event listener to the button
    updateButton.addEventListener("click", function() {
      // Reload the iframe by resetting its src attribute
      iframe.src = iframe.src;
      
      // Optional: Add visual feedback when button is clicked
      updateButton.textContent = "Updating...";
      setTimeout(function() {
        updateButton.textContent = "Update Presentation";
      }, 1000);
    });
  </script>
</body>
</html>
